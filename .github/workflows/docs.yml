name: docs

# Build the antsibull-docs Sphinx site for the collection and deploy it to
# the GitHub Pages environment. -gen is the canonical docs source; the
# `ansible-akeyless` mirror does not run this workflow.
#
# Prerequisites that can't be set in code:
#   1. Repo Settings > Pages > Source = "GitHub Actions"
#   2. The first successful `deploy` job creates the `github-pages`
#      environment; subsequent runs reuse it.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/modules/**'
      - 'plugins/module_utils/**'
      - 'galaxy.yml'
      - 'meta/runtime.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout into the collection layout
        # antsibull-docs requires the collection to be on disk at
        # ansible_collections/<namespace>/<name>/.
        uses: actions/checkout@v4
        with:
          path: ansible_collections/drzln0/akeyless

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install 'ansible-core>=2.14' antsibull-docs sphinx sphinx-ansible-theme

      - name: Build collection documentation
        working-directory: ansible_collections/drzln0/akeyless
        env:
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/{print $2; exit}' galaxy.yml)"
          mkdir -p build/docs
          antsibull-docs sphinx-init \
            --use-current \
            --dest-dir build/docs \
            --collection-version "${version}" \
            drzln0.akeyless
          cd build/docs
          pip install -r requirements.txt
          ./build.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ansible_collections/drzln0/akeyless/build/docs/build/html

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
